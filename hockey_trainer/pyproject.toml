[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "hockey-trainer"
version = "0.1.0"
description = "Laser stickhandling trainer: pan/tilt laser + camera puck tracking"
requires-python = ">=3.9"
dependencies = ["numpy", "pyyaml"]

[project.optional-dependencies]
# On the Pi, prefer `sudo apt install python3-opencv` and a venv with --system-site-packages.
vision = ["opencv-python-headless"]
pi = [
  "adafruit-circuitpython-motorkit",
  "gpiozero",
  "lgpio",
  "smbus2",
]
dev = ["pytest"]

[project.scripts]
trainer-hwcheck = "trainer.hwcheck:main"
trainer-calibrate = "trainer.calibrate:main"
trainer-game = "trainer.game:main"

[tool.setuptools]
packages = ["trainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
